name: RTL checks
on: [push, pull_request]
jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04's Yosys cannot parse the RTL's SystemVerilog integer casts;
      # its Verilator 5.020 also reports the mirrored address matrix as UNOPTFLAT.
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-03'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify EDA tools
        run: yosys -V && verilator --version
      - name: Check published evidence
        run: make check-evidence
      - name: Parallel-arbitration controller equivalence (small and non-power-of-two queues)
        run: python3 scripts/parallel_arbitration_check.py --trial . --out build/parallel_arbitration_current --depths 1 3
      - name: Verify private directory is untracked
        run: test -z "$(git ls-files -- local_notes)"
      - name: Lint, directed tests and parameter corners
        run: make lint test
      - name: Reproducible regression sample
        run: make regress SEEDS=5 N=1000 JOBS=2
      # No directory-wide artifact upload: local notes must remain local.
