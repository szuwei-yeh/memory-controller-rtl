name: RTL checks
on: [push, pull_request]
jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator and equivalence checker
        run: sudo apt-get update && sudo apt-get install -y verilator yosys
      - name: Verify private directory is untracked
        run: test -z "$(git ls-files -- local_notes)"
      - name: Lint, directed tests and parameter corners
        run: make lint test
      - name: Command-mask controller equivalence (small and non-power-of-two queues)
        run: python3 scripts/command_mask_equiv.py --depths 1 3
      - name: Reproducible regression sample
        run: make regress SEEDS=5 N=1000 JOBS=2
      # No directory-wide artifact upload: local notes must remain local.
