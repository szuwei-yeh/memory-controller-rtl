<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575" role="img" aria-labelledby="title desc">
<title id="title">Parallel command-class arbitration: before and after</title><desc id="desc">The baseline selects the command class before oldest-winner arbitration. The optimized RTL computes oldest column and PRE/ACT winners in parallel, then selects the class using column presence. No pipeline, state or command latency is added.</desc>
